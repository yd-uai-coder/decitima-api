events {
    worker_connections 1024;
}

http {
    # バージョン番号をレスポンスヘッダに出さない(既知の脆弱性の絞り込みを難しくする)
    server_tokens off;

    # IP 単位の粗いレート制限。アプリ側のレート制限(利用者単位)と別に、認証前の大量アクセス
    # (総当たり・ボディの巨大な連投)を nginx の段階で落とす。超過は 429 で返す。
    limit_req_zone $binary_remote_addr zone=api_per_ip:10m rate=20r/s;
    limit_req_zone $binary_remote_addr zone=auth_per_ip:10m rate=30r/m;
    limit_req_status 429;

    upstream backend {
        server backend:8000;
    }

    # 80番はcertbotのHTTP-01チャレンジ応答専用にし、それ以外は全てHTTPSへリダイレクトする
    server {
        listen 80;
        server_name _;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name _;

        # アプリ側の MAX_REQUEST_BODY_BYTES(既定 2,000,000)と揃える
        client_max_body_size 2m;

        # certbot等で発行した証明書をこのパスにマウントする想定
        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;

        # 以後 1 年間、このドメインへは HTTPS でしか接続させない
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        # API は JSON のみ返す。ブラウザが内容を推測したり、他サイトに埋め込まれたりしないようにする
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;

        # 認証系は総当たり・大量登録の標的になるため、他より厳しい IP 単位の制限をかける
        location /api/v1/auth/ {
            limit_req zone=auth_per_ip burst=10 nodelay;
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            # 利用者が送ってきた X-Forwarded-For を引き継がず、nginx が見た接続元で上書きする
            # (レート制限のキーになる接続元 IP を偽装させない。nginx がこの構成の最外周のため)
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            limit_req zone=api_per_ip burst=40 nodelay;
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /health {
            proxy_pass http://backend/health;
        }
    }
}
