[project]
name = "backend"
version = "0.1.0"
description = "FastAPI + LangChain + LangGraph backend"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.19.1",
    "asyncpg>=0.31.0",
    "fastapi[standard]>=0.141.1",
    "google-genai>=2.17.0",
    "httpx>=0.28.1",
    "langchain>=1.3.15",
    "langchain-google-genai>=4.3.3",
    "langchain-tavily>=0.2.18",
    "langgraph>=1.2.11",
    "pwdlib[argon2]>=0.3.1",
    "pydantic[email]>=2.13.4",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.13.0",
    "redis>=5.0",
    "sqlalchemy[asyncio]>=2.0",
    "tavily-python>=0.7.27",
    "uvicorn[standard]>=0.52.1",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.15.1",
    "ruff>=0.16.2",
]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["app", "tests"]
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "ASYNC", # flake8-async
]
ignore = ["B008"]  # FastAPI Depends() in default args

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-m 'not integration'"
markers = [
    "integration: requires live PostgreSQL and Redis (see docker compose)",
]

[tool.coverage.run]
source = ["app"]
omit = ["app/main.py"]
